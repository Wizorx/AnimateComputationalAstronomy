project:
  type: book

book:
  title: "Astronomia Computacional Animada"
  author: 
    - "Bruno E. Morgado"
    - "Helio J. Rocha Pinto"
    - "Luan M. Moraes (Org.)"
  chapters:
    - index.qmd
    - part: "Métodos Computacionais da Astronomia"
      chapters:
        - começo/comeco.qmd
        - POO.qmd
        - os&np.qmd
        - matplotlib.qmd
        - pandas/pandas.qmd
        - astropy/astropy.qmd
        - astroquery/astroquery.qmd
        - latex.qmd
        - git.qmd
        - raizes.qmd
        - ajuste/ajuste.qmd
        - montecarlo.qmd
        - calculo/calculo.qmd
        - edos.qmd

    - part: astroestatistica.qmd
    
    - part: tratamento.qmd

    - references.qmd
  appendices:
    - logica.qmd
  repo-url: https://github.com/wizorx/AnimateComputationalAstronomy
  repo-actions: [edit, source, issue]

language:
  section-title-appendices: "Apêndices"

bibliography: references.bib

crossref:
  chapters: true

format:
  live-html:
    respect-user-color-scheme: true
    lang: pt-BR
    number-sections: true
    number-depth: 3
    theme: 
      light: cosmo
      dark: darkly
    include-in-header: 
      - text: |
          <style>
          .cell-output {
            max-height: 500px;
            overflow-y: auto;
          }
          </style>